<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Speaker Diarization & Transcript</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f0f2f5;
      padding: 40px;
      font-family: 'Segoe UI', sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: left;
    }

    .btn {
      margin: 10px 10px 10px 0;
      min-width: 120px;
    }

    #transcript-box {
      height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      background-color: #f8f9fa;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      font-family: monospace;
    }

    .title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #343a40;
    }
    .summary-style {
      height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      background-color: #f8f9fa;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      font-family: monospace;
  }

  </style>
</head>
<body class="bg-light text-center py-5">

  <div class="container">
    <h3 class="mb-4"> 🎤 Live Speaker Diarization & Transcription</h3>

    <div class="mb-3">
      <label for="language-select" class="form-label">🎯 Select Language</label>
      <select id="language-select" class="form-select">
        <option value="en-IN" selected>English (India)</option>
        <option value="hi-IN">Hindi (India)</option>
        <option value="ta-IN">Tamil (India)</option>
        <option value="te-IN">Telugu (India)</option>
        <option value="bn-IN">Bengali (India)</option>
        <option value="gu-IN">Gujarati (India)</option>
        <option value="kn-IN">Kannada (India)</option>
        <option value="ml-IN">Malayalam (India)</option>
        <option value="mr-IN">Marathi (India)</option>
        <option value="pa-IN">Punjabi (India)</option>
        <option value="ur-IN">Urdu (India)</option>
      </select>
    </div>

    <div class="mb-3">
      <button id="startBtn" class="btn btn-success">Start Recording</button>
      <button id="stopBtn" class="btn btn-warning" disabled>Stop Recording</button>
      <button id="clearBtn" class="btn btn-danger">Clear</button>
      <button id="summary-button" onclick="getSummary()" class="btn btn-primary" disabled>Get Summary</button>
      <button id="translation-button" onclick="updateTranslations()" class="btn btn-primary" disabled>Get Translation</button>
      

    </div>

    <div id="status" class="mt-4 fs-5 text-primary"></div>

    <!-- Transcript display -->
    <div id="transcript-box" style="white-space: pre-line; border: 1px solid #ccc; padding: 10px;">
      <!-- Transcript and loading indicator will appear here -->
    </div>
    <!-- Summary Section -->
    <div class="mt-4">
      <h5 class="text-secondary">📝 Summary</h5>
      <div id="summary" class="summary-style"></div>
    </div>

    <!-- Key Points Section -->
    <div class="mt-4">
      <h5 class="text-secondary">📌 Key Points</h5>
      <div id="key-points" class="summary-style"></div>
    </div>

    <!-- Action Items Section -->
    <div class="mt-4">
      <h5 class="text-secondary">✅ Action Required</h5>
      <div id="actions" class="summary-style"></div>
    </div>

    <!-- Translation Section -->
    <div class="mt-4">
      <h5 class="text-secondary">🌐 Translation</h5>
      <div id="translation-box" class="summary-style"></div>
    </div>

  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusDiv = document.getElementById('status');

    const updateStatus = (message, color = 'text-primary') => {
      statusDiv.className = `mt-4 fs-5 ${color}`;
      statusDiv.textContent = message;
    };

    startBtn.onclick = async () => {
      const language = document.getElementById('language-select').value;
      const res = await fetch(`/start?lang=${language}`, { method: 'POST' });
      const data = await res.json();
      updateStatus(data.status, 'text-success');
      startBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = async () => {
      const res = await fetch('/stop', { method: 'POST' });
      const data = await res.json();
      updateStatus(data.status, 'text-danger');
      startBtn.disabled = false;
      stopBtn.disabled = true;
      document.getElementById("summary-button").disabled = false;
      document.getElementById("translation-button").disabled = false;
    };

    clearBtn.onclick = async () => {
    const res = await fetch('/clear', { method: 'POST' });
    const data = await res.json();
    updateStatus(data.status, 'text-secondary');

    // Clear the summary sections on the frontend
    document.getElementById("summary").innerText = "";
    document.getElementById("key-points").innerText = "";
    document.getElementById("actions").innerText = "";
    document.getElementById("translation-box").innerText = "";

    // Optional: also disable the summary button again
    document.getElementById("get-summary-btn").disabled = true;
};

function fetchTranscript() {
    fetch('/get_transcript')
        .then(res => res.json())
        .then(data => {
            const transcript = data.transcript;
            if (transcript && typeof transcript === "string") {
                document.getElementById("transcript-box").innerText = transcript;
            } else {
                document.getElementById("transcript-box").innerText = "";
            }
        });
}


// Refresh every 3 seconds
setInterval(fetchTranscript, 3000);
fetchTranscript();


function getSummary() {
  fetch('/get_summary')
        .then(res => res.json())
        .then(data => {
            document.getElementById("summary").innerText = data.summary || "No summary available.";
            document.getElementById("key-points").innerText = data.key_points || "No key points.";
            document.getElementById("actions").innerText = data.actions || "No action items.";
        });
}
function updateTranslations() {
  fetch('/get-translation')
    .then(response => response.json())
    .then(data => {
      const translationBox = document.getElementById('translation-box');
      translationBox.innerText = data.translation;
    })
    .catch(error => {
      console.error('Error fetching translation:', error);
    });
}

  </script>
</body>
</html>
